name: Publish Monorepo Packages

on:
  release:
    types: [created] 

jobs:
  publish-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Aplikasi-Kasir/frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rismanasdk' 
      - run: npm ci
      - run: npm run build 
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Aplikasi-Kasir/backend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@rismanasdk' 
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}